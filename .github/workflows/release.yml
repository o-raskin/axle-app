name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          base = json.loads(Path('ui/electron/package.json').read_text())['version'].rsplit('.', 1)[0]
          version = f"{base}.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)

  verify:
    name: Check and build all targets
    needs: version
    uses: ./.github/workflows/lint.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish verified release
    needs: [version, verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error
      - name: Verify inventory, upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release_assets.py publish --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
