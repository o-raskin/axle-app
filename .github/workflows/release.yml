name: Build distributions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Distinct main commits must never replace one another in the pending queue.
  group: build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a main branch build
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Select main when running Build distributions.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          base = json.loads(Path('ui/electron/package.json').read_text())['version'].rsplit('.', 1)[0]
          version = f"{base}.{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)

  verify:
    name: Check and build all targets
    needs: version
    uses: ./.github/workflows/lint.yml
    with:
      version: ${{ needs.version.outputs.version }}
