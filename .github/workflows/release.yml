name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_MAJOR: "0"
  RELEASE_MINOR: "1"

jobs:
  lint:
    name: Lint and test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run checks
        run: |
          python -m ruff check .
          python -m pytest tests -q
          python -m mypy --strict --ignore-missing-imports --scripts-are-modules gamepad_bridge.py probe_hub.py bridge

  version:
    name: Compute SemVer
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      asset_name: ${{ steps.semver.outputs.asset_name }}

    steps:
      - name: Compute version
        id: semver
        run: |
          set -euo pipefail
          version="${RELEASE_MAJOR}.${RELEASE_MINOR}.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          asset_name="lego-technic-gamepad-bridge-${tag}-macos-arm64"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

          echo "Version: ${version}"
          echo "Tag: ${tag}"
          echo "Asset: ${asset_name}"

  release:
    name: Build and publish release
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [lint, version]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build single-file executable
        run: PYTHON_BIN=python scripts/build_macos_release.sh

      - name: Smoke test executable
        run: dist/lego-technic-gamepad-bridge --help

      - name: Stage release asset
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/lego-technic-gamepad-bridge "release/${{ needs.version.outputs.asset_name }}"
          chmod +x "release/${{ needs.version.outputs.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.asset_name }}
          path: release/${{ needs.version.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          ASSET_NAME: ${{ needs.version.outputs.asset_name }}
        run: |
          set -euo pipefail
          asset="release/${ASSET_NAME}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > release-notes.md <<EOF
          Automated macOS build.

          Version: ${VERSION}
          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Workflow run: ${run_url}
          Artifact: ${ASSET_NAME}
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset#$ASSET_NAME" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$asset#$ASSET_NAME" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
