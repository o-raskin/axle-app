name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_MAJOR: "0"
  RELEASE_MINOR: "1"

jobs:
  lint:
    name: Lint and test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run checks
        run: |
          python -m ruff check .
          python -m pytest tests -q
          python -m mypy --strict --ignore-missing-imports --scripts-are-modules gamepad_bridge.py probe_hub.py bridge

  version:
    name: Compute SemVer
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      macos_asset_name: ${{ steps.semver.outputs.macos_asset_name }}
      linux_asset_name: ${{ steps.semver.outputs.linux_asset_name }}
      linux_appimage_asset_name: ${{ steps.semver.outputs.linux_appimage_asset_name }}

    steps:
      - name: Compute version
        id: semver
        run: |
          set -euo pipefail
          version="${RELEASE_MAJOR}.${RELEASE_MINOR}.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          macos_asset_name="lego-technic-gamepad-bridge-${tag}-macos-arm64"
          linux_asset_name="lego-technic-gamepad-bridge-${tag}-linux-x86_64"
          linux_appimage_asset_name="lego-technic-gamepad-bridge-${tag}-linux-x86_64.AppImage"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "macos_asset_name=${macos_asset_name}" >> "$GITHUB_OUTPUT"
          echo "linux_asset_name=${linux_asset_name}" >> "$GITHUB_OUTPUT"
          echo "linux_appimage_asset_name=${linux_appimage_asset_name}" >> "$GITHUB_OUTPUT"

          echo "Version: ${version}"
          echo "Tag: ${tag}"
          echo "macOS asset: ${macos_asset_name}"
          echo "Linux asset: ${linux_asset_name}"
          echo "Linux AppImage asset: ${linux_appimage_asset_name}"

  build_macos_release:
    name: Build macOS release
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [lint, version]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build single-file executable
        run: PYTHON_BIN=python scripts/build_macos_release.sh

      - name: Smoke test executable
        run: dist/lego-technic-gamepad-bridge --help

      - name: Stage release asset
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/lego-technic-gamepad-bridge "release/${{ needs.version.outputs.macos_asset_name }}"
          chmod +x "release/${{ needs.version.outputs.macos_asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.macos_asset_name }}
          path: release/${{ needs.version.outputs.macos_asset_name }}
          if-no-files-found: error
          retention-days: 30

  build_linux_release:
    name: Build Linux x86_64 release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, version]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build single-file executable
        run: PYTHON_BIN=python bash scripts/build_linux_release.sh

      - name: Smoke test executable
        run: dist/lego-technic-gamepad-bridge --help

      - name: Download AppImage tooling
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        run: |
          APPIMAGE_SKIP_BINARY_BUILD=1 \
          APPIMAGETOOL="$PWD/appimagetool-x86_64.AppImage" \
          APPIMAGE_OUTPUT="$PWD/dist/lego-technic-gamepad-bridge.AppImage" \
          bash scripts/build_linux_appimage.sh

      - name: Smoke test AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/lego-technic-gamepad-bridge.AppImage --help

      - name: Stage release asset
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/lego-technic-gamepad-bridge "release/${{ needs.version.outputs.linux_asset_name }}"
          cp dist/lego-technic-gamepad-bridge.AppImage "release/${{ needs.version.outputs.linux_appimage_asset_name }}"
          chmod +x "release/${{ needs.version.outputs.linux_asset_name }}"
          chmod +x "release/${{ needs.version.outputs.linux_appimage_asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-release
          path: |
            release/${{ needs.version.outputs.linux_asset_name }}
            release/${{ needs.version.outputs.linux_appimage_asset_name }}
          if-no-files-found: error
          retention-days: 30

  publish_release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, build_macos_release, build_linux_release]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          MACOS_ASSET_NAME: ${{ needs.version.outputs.macos_asset_name }}
          LINUX_ASSET_NAME: ${{ needs.version.outputs.linux_asset_name }}
          LINUX_APPIMAGE_ASSET_NAME: ${{ needs.version.outputs.linux_appimage_asset_name }}
        run: |
          set -euo pipefail
          macos_asset="release/${MACOS_ASSET_NAME}"
          linux_asset="release/${LINUX_ASSET_NAME}"
          linux_appimage_asset="release/${LINUX_APPIMAGE_ASSET_NAME}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          test -f "$macos_asset"
          test -f "$linux_asset"
          test -f "$linux_appimage_asset"

          cat > release-notes.md <<EOF
          Automated macOS and Linux x86_64 builds.

          Version: ${VERSION}
          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Workflow run: ${run_url}
          Artifacts:
          - ${MACOS_ASSET_NAME}
          - ${LINUX_ASSET_NAME}
          - ${LINUX_APPIMAGE_ASSET_NAME}
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$macos_asset#$MACOS_ASSET_NAME" \
              "$linux_asset#$LINUX_ASSET_NAME" \
              "$linux_appimage_asset#$LINUX_APPIMAGE_ASSET_NAME" \
              --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              "$macos_asset#$MACOS_ASSET_NAME" \
              "$linux_asset#$LINUX_ASSET_NAME" \
              "$linux_appimage_asset#$LINUX_APPIMAGE_ASSET_NAME" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
