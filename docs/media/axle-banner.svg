<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title description">
  <title id="title">Axle — build something. Drive it.</title>
  <desc id="description">An orange Axle emblem on a dark night-road backdrop. Your bricks. Your controller. Your next great drive.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1">
      <stop stop-color="#101a24"/>
      <stop offset="1" stop-color="#252c29"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#ff783d" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ff783d" stop-opacity=".7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d4e5ee" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1600" height="440" rx="28" fill="url(#night)"/>
  <rect width="1600" height="440" rx="28" fill="url(#grid)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M970 465 1440-30M1170 470 1640-25" stroke="#d4e5ee" stroke-opacity=".08" stroke-width="2"/>
    <path d="M1070 465 1540-30" stroke="url(#road)" stroke-width="5" stroke-dasharray="50 42"/>
    <path d="M0 384H690" stroke="#f4f3ef" stroke-opacity=".08"/>
  </g>
  <g transform="translate(84 65)">
    <g transform="translate(0 6) scale(.065)">
      <g transform="rotate(-34 512 512)">
        <rect x="215" y="300" width="580" height="166" rx="83" fill="#ff783d"/>
        <rect x="230" y="546" width="580" height="166" rx="83" fill="#f4f3ef"/>
        <g fill="#152027">
          <circle cx="298" cy="383" r="32"/><circle cx="712" cy="383" r="32"/>
          <circle cx="313" cy="629" r="32"/><circle cx="727" cy="629" r="32"/>
        </g>
      </g>
    </g>
    <text x="82" y="62" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#f4f3ef">axle<tspan fill="#ff783d">.</tspan></text>
    <text y="122" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#a6b7bd">GOOD TIMES. BUILT BY YOU.</text>
    <text y="206" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#f4f3ef">Build something. <tspan fill="#ff783d">Drive it.</tspan></text>
    <text y="257" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#b9c7ca">Your bricks. Your controller. Your next great drive.</text>
    <text y="313" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2" fill="#ffae88">MACOS  /  WINDOWS  /  LINUX  /  STEAM DECK</text>
  </g>
</svg>
